[package]
name = "fwkarq"
version = "1.2.2"
edition = "2024"
description = "Basic framework for project scaffolding"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "^0"
filetime = "^0"
fwkarq_macros = { version = "^1", optional = true }
reqwest = { version = "^0", optional = true }
serde = { version = "^1", optional = true }
serde_derive = { version = "^1", optional = true }
serde_json = { version = "^1", optional = true }
serde_yaml = { version = "^0", optional = true }
thiserror = "^2"
tokio = { version = "^1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
] }
toml = { version = "^1", optional = true }

[lib]
doctest = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
opt-level = 3

[features]
default = []
macros = ["fwkarq_macros"]
serialization = ["serde", "serde_derive", "serde_json", "serde_yaml", "toml"]
event_bus = []
rest_client = ["reqwest"]
shell = []
settings = []
translation = []
